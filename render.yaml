services:
  # NIS AI School — Production Express Backend API
  - type: web
    name: nis-ai-school-backend
    env: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: nis-ai-school-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@nis-ai.edu.uz
      - key: ADMIN_PASSWORD
        value: NisAdmin2026!
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: FRONTEND_URL
        value: https://nis-ai-school.vercel.app,http://localhost:5173

databases:
  # NIS AI School — Managed Production PostgreSQL Database
  - name: nis-ai-school-db
    plan: free
    region: frankfurt
    databaseName: nisaimaktabi
    user: nisaimaktabi
